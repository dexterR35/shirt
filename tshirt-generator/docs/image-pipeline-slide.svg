<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Manrope, 'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>T-shirt Generator: image pipeline from base photo to download</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8491a5"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2ba0a2"/>
    </marker>
    <style>
      .card { fill: #0b1a2b; stroke: #182a40; stroke-width: 2; }
      .num { fill: #2ba0a2; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
      .num-out { fill: #f5b82e; }
      .h { fill: #f6f7fa; font-size: 30px; font-weight: 700; }
      .where { fill: #8491a5; font-size: 17px; font-weight: 600; letter-spacing: 1.2px; }
      .t { fill: #a8b3c4; font-size: 20px; }
      .strong { fill: #f6f7fa; font-weight: 600; }
      .code { fill: #2ba0a2; font-family: Consolas, 'SFMono-Regular', monospace; font-size: 17px; }
      .pill { fill: #102238; stroke: #3d5169; stroke-width: 1.5; }
      .pill-t { fill: #f6f7fa; font-size: 18px; font-weight: 600; }
      .flow { stroke: #8491a5; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#061224"/>

  <!-- Header -->
  <text x="80" y="104" fill="#8491a5" font-size="20" font-weight="600" letter-spacing="4">T-SHIRT GENERATOR · IMAGE PROCESSING</text>
  <text x="80" y="172" class="h" style="font-size:60px;letter-spacing:-1.5px">From the base photo to the download</text>
  <text x="80" y="224" class="t" style="font-size:24px">The photo is never redrawn. Kit colors are vector paint, multiplied into the photo's pixels. Preview and download share one composite.</text>

  <!-- Stage cards: x = 80, 438, 796, 1154, 1512 · width 328 -->
  <g>
    <!-- 1 Base photo -->
    <rect class="card" x="80" y="270" width="328" height="500" rx="20"/>
    <text x="112" y="318" class="num">01 · BUILD</text>
    <text x="112" y="362" class="h">Base photo</text>
    <text x="112" y="392" class="where">npm run base:prepare</text>
    <!-- mini shirt -->
    <path d="M204 424l30-14q14 12 30 12t30-12l30 14 28 40-24 16-12-12v86h-104v-86l-12 12-24-16z" fill="#f6f7fa" opacity=".92"/>
    <path d="M234 410q14 12 30 12t30-12" stroke="#a8b3c4" stroke-width="3" fill="none"/>
    <text x="112" y="584" class="t"><tspan class="strong">base.png</tspan> 8000 × 5000</text>
    <text x="112" y="614" class="t">hash + size checked</text>
    <text x="112" y="658" class="t">→ 8K master (as is)</text>
    <text x="112" y="688" class="t">→ 2048 lossless WebP</text>
    <text x="112" y="718" class="t">   crop of the shirt</text>

    <!-- 2 Kit paint -->
    <rect class="card" x="438" y="270" width="328" height="500" rx="20"/>
    <text x="470" y="318" class="num">02 · KIT</text>
    <text x="470" y="362" class="h">Kit paint</text>
    <text x="470" y="392" class="where">validated SVG · 200 × 200 grid</text>
    <!-- paint layer mini: flat colored shirt shape with stripes -->
    <g transform="translate(358 0)">
      <clipPath id="mini-shirt"><path d="M204 424l30-14q14 12 30 12t30-12l30 14 28 40-24 16-12-12v86h-104v-86l-12 12-24-16z"/></clipPath>
      <g clip-path="url(#mini-shirt)">
        <rect x="170" y="400" width="190" height="160" fill="#c8102e"/>
        <rect x="242" y="400" width="14" height="160" fill="#f6f7fa"/>
        <rect x="272" y="400" width="14" height="160" fill="#f6f7fa"/>
      </g>
      <path d="M204 424l30-14q14 12 30 12t30-12l30 14 28 40-24 16-12-12v86h-104v-86l-12 12-24-16z" fill="none" stroke="#2ba0a2" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
    <text x="470" y="584" class="t">Home / Away revision</text>
    <text x="470" y="614" class="t">+ reviewed PNG layout</text>
    <text x="470" y="658" class="t">body, sleeves, cuffs,</text>
    <text x="470" y="688" class="t">collar ring, stripes</text>
    <text x="470" y="718" class="t">+ optional color edits</text>

    <!-- 3 Rasterize -->
    <rect class="card" x="796" y="270" width="328" height="500" rx="20"/>
    <text x="828" y="318" class="num">03 · PAGE</text>
    <text x="828" y="362" class="h">Rasterize</text>
    <text x="828" y="392" class="where">at the exact output size</text>
    <g transform="translate(716 0)">
      <rect x="190" y="410" width="148" height="148" rx="6" fill="#f6f7fa"/>
      <rect x="199" y="419" width="130" height="130" fill="none" stroke="#8491a5" stroke-width="1.5" stroke-dasharray="4 4"/>
      <g transform="translate(264 484) scale(0.7) translate(-264 -470)"><g clip-path="url(#mini-shirt)">
        <rect x="170" y="400" width="190" height="160" fill="#c8102e"/>
        <rect x="242" y="400" width="14" height="160" fill="#f6f7fa"/>
        <rect x="272" y="400" width="14" height="160" fill="#f6f7fa"/>
      </g></g>
    </g>
    <text x="828" y="614" class="t">SVG → bitmap on white</text>
    <text x="828" y="644" class="t">1/16 margin, 7/8 span</text>
    <text x="828" y="688" class="t">handed to a worker</text>
    <text x="828" y="718" class="t">without copying</text>

    <!-- 4 Composite -->
    <rect class="card" x="1154" y="270" width="328" height="500" rx="20" stroke="#2ba0a2"/>
    <text x="1186" y="318" class="num">04 · WORKER</text>
    <text x="1186" y="362" class="h">Composite</text>
    <text x="1186" y="392" class="where">Web Worker · OffscreenCanvas</text>
    <rect x="1186" y="420" width="264" height="120" rx="14" fill="#102238" stroke="#3d5169" stroke-width="1.5"/>
    <text x="1318" y="468" text-anchor="middle" fill="#f6f7fa" font-size="24" font-weight="700">RGB = photo × paint</text>
    <text x="1318" y="512" text-anchor="middle" fill="#2ba0a2" font-size="22" font-weight="600">alpha = photo alpha</text>
    <text x="1186" y="584" class="t">≤ 2048 → WebP copy</text>
    <text x="1186" y="614" class="t">&gt; 2048 → 8K master</text>
    <text x="1186" y="658" class="t">folds, light and soft</text>
    <text x="1186" y="688" class="t">edges kept from the</text>
    <text x="1186" y="718" class="t">photo, never enlarged</text>

    <!-- 5 Output -->
    <rect class="card" x="1512" y="270" width="328" height="500" rx="20" stroke="#f5b82e"/>
    <text x="1544" y="318" class="num num-out">05 · OUTPUT</text>
    <text x="1544" y="362" class="h">Show &amp; download</text>
    <text x="1544" y="392" class="where">same pixels everywhere</text>
    <text x="1544" y="444" class="t"><tspan class="strong">Preview</tspan> 1024–2048</text>
    <text x="1544" y="474" class="t"><tspan class="strong">Thumbnails</tspan> 256</text>
    <line x1="1544" y1="498" x2="1808" y2="498" stroke="#182a40" stroke-width="2"/>
    <text x="1544" y="536" class="t"><tspan class="strong">Download</tspan> after Yes/No</text>
    <text x="1544" y="566" class="t">128 → 4096 px</text>
    <text x="1544" y="596" class="t">1:1 · 4:5 · 16:9 · 9:16</text>
    <rect class="pill" x="1544" y="620" width="74" height="38" rx="19"/>
    <text x="1581" y="646" text-anchor="middle" class="pill-t">PNG</text>
    <rect class="pill" x="1628" y="620" width="84" height="38" rx="19"/>
    <text x="1670" y="646" text-anchor="middle" class="pill-t">WebP</text>
    <rect class="pill" x="1722" y="620" width="82" height="38" rx="19"/>
    <text x="1763" y="646" text-anchor="middle" class="pill-t">AVIF</text>
    <text x="1544" y="700" class="t">single files or one ZIP</text>
    <text x="1544" y="730" class="t">transparent background</text>
  </g>

  <!-- Flow arrows between cards -->
  <path class="flow" d="M408 520H432" marker-end="url(#arrow)"/>
  <path class="flow" d="M766 520H790" marker-end="url(#arrow)"/>
  <path class="flow" d="M1124 520H1148" marker-end="url(#arrow)" stroke="#2ba0a2"/>
  <path class="flow" d="M1482 520H1506" marker-end="url(#arrow)"/>
  <!-- Base photo feeds the composite directly -->
  <path d="M244 770V820H1318V776" fill="none" stroke="#2ba0a2" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-accent)"/>
  <rect x="580" y="804" width="400" height="32" rx="16" fill="#061224"/>
  <text x="780" y="827" text-anchor="middle" fill="#2ba0a2" font-size="19" font-weight="600">photo pixels go straight to the composite</text>

  <!-- Footer principles -->
  <g font-size="21">
    <rect x="80" y="880" width="1760" height="90" rx="20" fill="#0b1a2b" stroke="#182a40" stroke-width="2"/>
    <circle cx="124" cy="925" r="7" fill="#2ba0a2"/>
    <text x="144" y="932" fill="#f6f7fa" font-weight="600">Fabric is the photo</text>
    <circle cx="490" cy="925" r="7" fill="#2ba0a2"/>
    <text x="510" y="932" fill="#f6f7fa" font-weight="600">Paint is crisp vector</text>
    <circle cx="864" cy="925" r="7" fill="#2ba0a2"/>
    <text x="884" y="932" fill="#f6f7fa" font-weight="600">Never upscaled</text>
    <circle cx="1170" cy="925" r="7" fill="#2ba0a2"/>
    <text x="1190" y="932" fill="#f6f7fa" font-weight="600">Page stays responsive</text>
    <circle cx="1560" cy="925" r="7" fill="#f5b82e"/>
    <text x="1580" y="932" fill="#f6f7fa" font-weight="600">No kit? Plain photo</text>
  </g>
</svg>
